<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | ADAPTI</title>
    <link rel="stylesheet" href="../CSS/style.css">
  </head>
  <body>
    <div class="canto superior" aria-hidden="true"></div>
    <div class="canto inferior" aria-hidden="true"></div>
    <main class="caixa login">
      <img class="logo" src="../assets/logo-adapti.png" alt="ADAPTI" width="170">
      <h1>Entrar</h1>
      <p class="subtitulo">Continue aprendendo no seu ritmo</p>

      <div id="mensagem-erro" style="color: #e74c3c; margin-bottom: 10px; display: none;"></div>

      <form id="form-login">
        <label for="email">E-mail</label>
        <div class="campo">
          <img src="../assets/email.svg" alt="">
          <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <label for="senha">Senha</label>
        <div class="campo">
          <img src="../assets/cadeado.svg" alt="">
          <input id="senha" name="senha" type="password" placeholder="sua senha" autocomplete="current-password" required>
          <img class="olho" src="../assets/olho.svg" alt="Mostrar senha" style="cursor: pointer;">
        </div>

        <a class="recuperar" role="link" aria-disabled="true" href="esqueci-senha.html">Esqueci minha senha</a>
        <button type="submit">Entrar</button>
      </form>
      <hr>
      <p class="opcao-cadastro">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </main>

    <script src="../JS/api.js"></script>
    <script src="../JS/auth.js"></script>
  </body>
</html>
