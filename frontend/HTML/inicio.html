<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início | ADAPTI</title>
    <link rel="stylesheet" href="../CSS/style.css">
  </head>
  <body class="app">
    <div class="canto superior" aria-hidden="true"></div>
    <div class="canto inferior" aria-hidden="true"></div>

    <nav class="menu" aria-label="Menu principal">
      <img class="menu-logo" src="../assets/logo-adapti.png" alt="ADAPTI">
      <a class="menu-item ativo" href="inicio.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3L12 3z"/></svg>
        <span class="menu-texto">Início</span>
      </a>
      <a class="menu-item" href="configurar-pratica.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
        <span class="menu-texto">Praticar</span>
      </a>
      <a class="menu-item" href="desempenho.html">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="4" width="4" height="17" rx="1"/></svg>
        <span class="menu-texto">Desempenho</span>
      </a>
      <a class="menu-item" href="#" id="btn-logout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    <span class="menu-texto">Sair</span>
  </a>
    </nav>

    <main class="painel">
      <img class="logo topo-logo" src="../assets/logo-adapti.png" alt="ADAPTI">

      <header class="saudacao">
        <h1 id="user-name">Olá, Carregando... 👋</h1>
        <p class="subtitulo">Pronto para praticar hoje?</p>
      </header>

      <section class="atalhos" aria-label="Começar a estudar">
        <a class="atalho roxo" href="configurar-pratica.html">
          <span class="atalho-icone"><img src="../assets/editar.svg" alt=""></span>
          <span class="atalho-titulo">Resolver questões</span>
          <span class="atalho-seta"><img src="../assets/seta.svg" alt=""></span>
        </a>
        <a class="atalho azul" href="configurar-pratica.html">
          <span class="atalho-icone"><img src="../assets/simulado.svg" alt=""></span>
          <span class="atalho-titulo">Fazer simulado</span>
          <span class="atalho-seta"><img src="../assets/seta.svg" alt=""></span>
        </a>
      </section>

      <section class="secao">
        <h2>Seu desempenho</h2>
        <div class="estatisticas">
        <div class="estatistica">
          <span class="estatistica-icone"><img src="../assets/questoes.svg" alt=""></span>
          <p class="estatistica-nome">Questões respondidas</p>
          <p class="estatistica-valor" id="stat-total">0</p>
        </div>
        <div class="estatistica">
          <span class="estatistica-icone"><img src="../assets/editar.svg" alt=""></span>
          <p class="estatistica-nome">Taxa de acerto</p>
          <p class="estatistica-valor" id="stat-accuracy">0%</p>
        </div>
          <div class="estatistica">
            <span class="estatistica-icone"><img src="../assets/desempenho.svg" alt=""></span>
            <p class="estatistica-nome">Simulados</p>
            <p class="estatistica-valor">0</p>
          </div>
        </div>
      </section>

      <section class="secao">
        <h2>Último resultado</h2>
        <a class="resultado" href="desempenho.html">
          <span class="atalho-icone"><img src="../assets/questoes.svg" alt=""></span>
          <span class="resultado-texto">
            <span class="atalho-titulo">Simulado ENEM</span>
            <span class="resultado-detalhe">36 de 45 acertos · 80%</span>
          </span>
          <span class="atalho-seta"><img src="../assets/seta.svg" alt=""></span>
        </a>
      </section>
    </main>
    <script src="../JS/inicio.js"></script>
  </body>
</html>
