<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | ADAPTI</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="canto superior" aria-hidden="true"></div>
    <div class="canto inferior" aria-hidden="true"></div>
    <main class="caixa senha">
      <img class="logo" src="assets/logo-adapti.png" alt="ADAPTI">
      <h1>Redefinir senha</h1>
      
      <form id="form-redefinir">
        <label for="nova-senha">Nova senha</label>
        <div class="campo">
          <img src="assets/cadeado.svg" alt="">
          <input
            id="nova-senha"
            name="nova-senha"
            type="password"
            placeholder="sua nova senha"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <label for="confirmar-senha">Confirmar senha</label>
        <div class="campo">
          <img src="assets/cadeado.svg" alt="">
          <input
            id="confirmar-senha"
            name="confirmar-senha"
            type="password"
            placeholder="repita sua nova senha"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button type="button">Redefinir senha</button>
        <p class="mensagem-recuperacao" id="mensagem" role="status" hidden></p>
      </form>
      <hr>
      <p class="opcao-cadastro"><a href="login.html">Voltar para entrar</a></p>
    </main>
  </body>
</html>
