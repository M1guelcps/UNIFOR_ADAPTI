<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 4 de 10 | ADAPTI</title>
    <link rel="stylesheet" href="../CSS/style.css">
  </head>
  <body class="app">
    <div class="canto superior" aria-hidden="true"></div>
    <div class="canto inferior" aria-hidden="true"></div>

    <nav class="menu" aria-label="Menu principal">
      <img class="menu-logo" src="../assets/logo-adapti.png" alt="ADAPTI">
      <a class="menu-item" href="inicio.html">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3L12 3z"/></svg>
        <span class="menu-texto">Início</span>
      </a>
      <a class="menu-item ativo" href="configurar-pratica.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
        <span class="menu-texto">Praticar</span>
      </a>
      <a class="menu-item" href="desempenho.html">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="4" width="4" height="17" rx="1"/></svg>
        <span class="menu-texto">Desempenho</span>
      </a>
    </nav>

    <main class="painel">
      <img class="logo topo-logo" src="../assets/logo-adapti.png" alt="ADAPTI">

      <article class="questao" id="area-questao" style="display: none;">
    <header class="questao-topo">
      <h1 id="titulo-questao">Questão 1 de X</h1>
      
      <!-- Adicionamos um espaço para o cronômetro caso esteja ativo -->
      <div id="relogio-container" style="display: none; font-weight: bold; color: var(--cor-primaria);">
        ⏱ <span id="tempo-corrido">00:00</span>
      </div>

      <div class="progresso" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso">
        <span id="barra-progresso" style="width: 0%"></span>
      </div>
    </header>

    <div class="questao-corpo">
      <div class="enunciado">
        <p class="etiqueta" id="etiqueta-questao">
          <span class="estatistica-icone"><img src="../assets/desempenho.svg" alt=""></span>
          CARREGANDO...
        </p>
        
        <!-- O texto dinâmico (e imagens) da questão entrará aqui -->
        <div id="texto-enunciado"></div>
      </div>

      <form class="respostas" id="form-respostas">
        <fieldset id="container-alternativas">
          <legend id="texto-pergunta">Carregando alternativas...</legend>
          <!-- As labels das alternativas serão injetadas aqui -->
        </fieldset>

        <div class="navegacao">
          <button type="button" id="btn-anterior" class="botao-secundario" style="visibility: hidden;">Anterior</button>
          <button type="submit" id="btn-responder" class="botao-principal">Responder</button>
          <button type="button" id="btn-proxima" class="botao-principal" style="display: none;">Próxima</button>
        </div>
      </form>
    </div>
  </article>

  <!-- Mensagem enquanto busca na API -->
  <div id="loading" style="text-align: center; padding: 4rem;">
    <h2>Preparando sua prática...</h2>
  </div>
    </main>
    <script src="../JS/questao.js"></script>
  </body>
</html>
