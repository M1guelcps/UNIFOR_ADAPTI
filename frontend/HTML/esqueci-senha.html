<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha | ADAPTI</title>
    <link rel="stylesheet" href="../CSS/style.css">
  </head>
  <body>
    <div class="canto superior" aria-hidden="true"></div>
    <div class="canto inferior" aria-hidden="true"></div>
    <main class="caixa senha">
      <img class="logo" src="../assets/logo-adapti.png" alt="ADAPTI" width="170">
      <h1>Esqueci minha senha</h1>
      <p class="subtitulo">Informe o e-mail da sua conta para recuperar o acesso</p>

      <form id="form-recuperar">
        <label for="email">E-mail</label>
        <div class="campo">
          <img src="../assets/email.svg" alt="">
          <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <button type="button">Recuperar senha</button>
        
      </form>
      <hr>
      <p class="opcao-cadastro">Lembrou sua senha? <a href="login.html">Voltar para entrar</a></p>
    </main>
  </body>
</html>
